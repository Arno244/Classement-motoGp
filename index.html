<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement pilotes MotoGP 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f7;--card:#fff;--tx:#15151e;--mut:#6b6b78;--line:#e4e4ea;--acc:#e10600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35}}
:root[data-theme="dark"]{--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.next{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.next b{color:var(--acc)}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:12px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pos{font-weight:700;font-size:16px;text-align:center}
.name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.team{color:var(--mut);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.pts{text-align:right;font-weight:700;font-size:18px}
.gap{color:var(--mut);font-size:11px;font-weight:400;display:block}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 13px/1.2 system-ui,sans-serif;padding:8px 4px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.race{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rd{color:var(--mut);font-weight:700;font-size:13px;text-align:center}
.gp{font-weight:600;font-size:15px}
.dt{color:var(--mut);font-size:12px}
.win{text-align:right;font-size:14px;font-weight:600}
.win small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.next{cursor:pointer}
.next.open .chev{transform:rotate(180deg)}
#cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:-4px 0 12px}
.crow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow b{font-weight:600}
.crow small{display:block;color:var(--mut);font-size:11px}
.crow .d{color:var(--mut);font-size:12px;text-align:right}
.crow.done .d::after{content:" ✓"}
.crow.nx{color:var(--acc)}
.crow.nx .d{color:var(--acc);font-weight:700}
.race{cursor:pointer}
.chev{color:var(--mut);font-size:11px;margin-left:4px;display:inline-block;transition:transform .2s}
.race.open .chev{transform:rotate(180deg)}
.det{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.race.open .det{display:block}
.rr{display:grid;grid-template-columns:26px 12px 1fr auto;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.rp{color:var(--mut);font-weight:700;text-align:right}
.rt{color:var(--mut);font-size:12px}
.nodet,.note{color:var(--mut);font-size:12px}
.foot{color:var(--mut);font-size:12px;margin:14px 0 6px;text-align:center}
.drv{cursor:pointer}
.dh{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;cursor:default}
.drv.open .dh{display:block}
.drv.open .chev{transform:rotate(180deg)}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:64px;height:64px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.dn{font-weight:700;font-size:16px}
.ds{color:var(--mut);font-size:12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.st div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut)}
.st b{display:block;font-size:18px;color:var(--tx)}
.chs{display:flex;flex-wrap:wrap;gap:5px}
.ch{min-width:44px;text-align:center;background:var(--bg);border-radius:8px;padding:4px 5px;font-size:13px;font-weight:700}
.ch i{display:block;font-style:normal;font-size:9px;color:var(--mut);font-weight:600}
.ch.w{background:#f2c200;color:#15151e}.ch.w i{color:#15151e}
.ch.p{background:#aeb4c0;color:#15151e}.ch.p i{color:#15151e}
.ch.x{background:#c0261b;color:#fff}.ch.x i{color:#fff}
.ch.n{opacity:.4}
.lg{color:var(--mut);font-size:11px;margin-top:8px}
.tg{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;letter-spacing:.4px;line-height:1.5;flex:none;display:inline-block}
.dn .tg,.rr .tg{margin-left:6px}
.pn{--tc:#888}
.dhead{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 30%,transparent),transparent 80%);border-radius:16px;padding:12px}
.av{box-shadow:0 0 0 3px var(--tc)}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.hero div{background:var(--bg);border-radius:14px;padding:10px 4px 9px;text-align:center;font-size:11px;color:var(--mut);border-top:3px solid var(--tc)}
.hero b{display:block;font-size:30px;line-height:1.1;color:var(--tx);font-weight:800;letter-spacing:-.5px}
.hero em{font-style:normal;display:block;font-size:15px;margin-bottom:1px}
.st div{border-radius:12px}
.st b{font-size:17px}
.ch{border-radius:10px}
.ch.w{background:linear-gradient(135deg,#ffd84d,#f2a900)}
.ch.p{background:linear-gradient(135deg,#dde1e8,#9ca3b2)}
.bars{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:2px 0 4px}
.bc{display:flex;flex-direction:column;align-items:center;min-width:18px}
.bb{width:100%;border-radius:5px 5px 0 0;background:var(--tc);opacity:.85}
.bb.tt{background:linear-gradient(180deg,#ffd84d,#f2a900);opacity:1}
.bv{font-size:9px;color:var(--mut);height:12px;line-height:12px;font-weight:700}
.by{font-size:9px;color:var(--mut);margin-top:2px}
.pn{position:relative;overflow:hidden;border-radius:16px}
.pn>*:not(.wm){position:relative;z-index:1}
.wm{position:absolute;right:8px;top:18px;font-weight:900;font-style:italic;letter-spacing:-2px;color:var(--tc);opacity:.17;pointer-events:none;white-space:nowrap;z-index:0}
</style>
</head>
<body>
<h1>🏍️ Classement pilotes <span>MotoGP 2026</span></h1>
<p class="sub" id="sub"></p>
<div class="next" id="nextbox"><span>Prochain GP : <b id="nx"></b> <span class="chev">▼</span></span><span id="nd"></span></div>
<div id="cal" hidden></div>
<div class="tabs"><button id="t1" class="on">Classement pilotes</button><button id="t2">Courses</button><button id="t3">Classement équipes</button></div>
<div id="v1"><input id="q" type="search" placeholder="Rechercher un pilote ou une écurie…">
<div id="list"></div></div>
<div id="v2" hidden><div id="races"></div></div>
<div id="v3" hidden><div id="cons"></div></div>
<p class="foot">Mis à jour après chaque Grand Prix.</p>
<script>
const OPEN=new Set();
const CARS={"Mercedes":"W17","Ferrari":"SF-26","McLaren":"MCL40","Red Bull":"RB22","Racing Bulls":"VCARB 03","Alpine":"A526","Haas":"VF-26","Audi":"R26","Aston Martin":"AMR26","Williams":"FW48","Cadillac":"MAC-26","Aprilia Racing":"RS-GP26","Trackhouse":"RS-GP26","Ducati Lenovo Team":"Desmosedici GP26","Gresini":"Desmosedici GP26","VR46":"Desmosedici GP26","Pramac Yamaha":"YZR-M1","Yamaha":"YZR-M1","Red Bull KTM Factory":"RC16","KTM Tech3":"RC16","Honda HRC":"RC213V","LCR Honda":"RC213V"};
const CARO={"Fermín Aldeguer":"Desmosedici GP25"};
function carOf(n,t){return CARO[n]||CARS[t]||""}
function wm(n,t){const c=carOf(n,t);return c?`<div class="wm" style="font-size:${c.length>9?34:54}px">${c}</div>`:""}
function ico(l){return l.startsWith("Victoires")?"🏆":l.startsWith("Podiums")?"🏅":l.startsWith("Points")?"⚡":l.startsWith("Titres")?"👑":l.startsWith("Pole")?"⏱️":""}
function stHTML(st,h){return `<div class="hero">${h.map(i=>`<div>${ico(st[i][1])?`<em>${ico(st[i][1])}</em>`:""}<b>${st[i][0]}</b>${st[i][1]}</div>`).join("")}</div><div class="st">${st.filter((_,i)=>!h.includes(i)).map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join("")}</div>`}
const ABBR={"Mercedes":"MER","Ferrari":"FER","McLaren":"MCL","Red Bull":"RBR","Racing Bulls":"RB","Alpine":"ALP","Haas":"HAA","Audi":"AUD","Aston Martin":"AMR","Williams":"WIL","Cadillac":"CAD","Aprilia Racing":"APR","Trackhouse":"TRK","Ducati Lenovo Team":"DUC","VR46":"VR4","Gresini":"GRE","Red Bull KTM Factory":"KTM","KTM Tech3":"TE3","Honda HRC":"HRC","LCR Honda":"LCR","Yamaha":"YAM","Pramac Yamaha":"PRA"};
function tg(t){if(!t)return"";const c=COL[t]||"#888",m=/^#/.test(c)?c.match(/\w\w/g).map(h=>parseInt(h,16)):[136,136,136],l=.299*m[0]+.587*m[1]+.114*m[2];return `<span class="tg" style="background:${c};color:${l>150?"#15151e":"#fff"}">${ABBR[t]||t.slice(0,3).toUpperCase()}</span>`}
const DATA={
  round:16, total:22, after:"Grand Prix du Japon (Motegi)", date:"4 octobre 2026",
  next:"Indonésie (Mandalika)", nextDate:"11 octobre 2026",
  drivers:[
    ["Jorge Martín","Aprilia Racing",333],["Marc Márquez","Ducati Lenovo Team",331],
    ["Marco Bezzecchi","Aprilia Racing",284],["Pedro Acosta","Red Bull KTM Factory",243],
    ["Ai Ogura","Trackhouse",237],["Fabio Di Giannantonio","VR46",230],
    ["Raúl Fernández","Trackhouse",216],["Francesco Bagnaia","Ducati Lenovo Team",164],
    ["Álex Márquez","Gresini",158],["Fermín Aldeguer","Gresini",122],
    ["Enea Bastianini","KTM Tech3",116],["Luca Marini","Honda HRC",104],
    ["Brad Binder","Red Bull KTM Factory",99],["Diogo Moreira","LCR Honda",74],
    ["Fabio Quartararo","Yamaha",66],["Franco Morbidelli","VR46",57],
    ["Johann Zarco","LCR Honda",48],["Joan Mir","Honda HRC",33],
    ["Jack Miller","Pramac Yamaha",28],["Álex Rins","Yamaha",24],
    ["Toprak Razgatlıoğlu","Pramac Yamaha",18],["Maverick Viñales","KTM Tech3",12],
    ["Iker Lecuona","Gresini",9],["Augusto Fernández","Yamaha",6],
    ["Pol Espargaró","KTM Tech3",5],["Takaaki Nakagami","Honda HRC",3]
  ]
};
const C={A:"#a43fd4",D:"#d11a2a",K:"#ff6a13",H:"#f2c200",Y:"#1e5cff"};
const COL={"Aprilia Racing":C.A,"Trackhouse":C.A,"Ducati Lenovo Team":C.D,"VR46":C.D,"Gresini":C.D,"Red Bull KTM Factory":C.K,"KTM Tech3":C.K,"Honda HRC":C.H,"LCR Honda":C.H,"Yamaha":C.Y,"Pramac Yamaha":C.Y};
document.getElementById("sub").textContent="Après la manche "+DATA.round+"/"+DATA.total+" · "+DATA.after+" · "+DATA.date;
document.getElementById("nx").textContent=DATA.next;
document.getElementById("nd").textContent=DATA.nextDate;
const max=DATA.drivers[0][2];
function render(f){
  const t=(f||"").toLowerCase();
  document.getElementById("list").innerHTML=DATA.drivers.map((d,i)=>{
    if(t&&!(d[0]+" "+d[1]).toLowerCase().includes(t))return"";
    const c=COL[d[1]]||"#888",gap=i?"−"+(max-d[2])+" pts":"Leader";
    return `<div class="row drv${OPEN.has(d[0])?" open":""}" data-n="${d[0]}"><div class="pos">${i+1}</div><div><div class="name"><span class="dot" style="background:${c}"></span>${d[0]}${tg(d[1])}<span class="chev">▼</span></div><div class="team">${d[1]}</div><div class="bar"><i style="width:${d[2]/max*100}%;background:${c}"></i></div></div><div class="pts">${d[2]}<span class="gap">${gap}</span></div><div class="dh">${OPEN.has(d[0])?hist(d[0]):""}</div></div>`;
  }).join("");
}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render();
const RACES=[
["Thaïlande","1 mars","Marco Bezzecchi","Aprilia Racing"],["Brésil","22 mars","Marco Bezzecchi","Aprilia Racing"],
["États-Unis","29 mars","Marco Bezzecchi","Aprilia Racing"],["Espagne","26 avr.","Álex Márquez","Gresini"],
["France","10 mai","Jorge Martín","Aprilia Racing"],["Catalogne","17 mai","Fabio Di Giannantonio","VR46"],
["Italie","31 mai","Marco Bezzecchi","Aprilia Racing"],["Hongrie","7 juin","Marc Márquez","Ducati Lenovo Team"],
["Tchéquie","21 juin","Marc Márquez","Ducati Lenovo Team"],["Pays-Bas","28 juin","Ai Ogura","Trackhouse"],
["Allemagne","12 juil.","Marc Márquez","Ducati Lenovo Team"],["Grande-Bretagne","9 août","Raúl Fernández","Trackhouse"],
["Aragon","30 août","Marc Márquez","Ducati Lenovo Team"],["Saint-Marin","13 sept.","Marc Márquez","Ducati Lenovo Team"],
["Autriche","20 sept.","Pedro Acosta","Red Bull KTM Factory"],["Japon","4 oct.","Marc Márquez","Ducati Lenovo Team"]
];
const N={BEZ:"Marco Bezzecchi",ACO:"Pedro Acosta",RFE:"Raúl Fernández",MAR:"Jorge Martín",OGU:"Ai Ogura",DIG:"Fabio Di Giannantonio",BIN:"Brad Binder",MOR:"Franco Morbidelli",BAG:"Francesco Bagnaia",MRN:"Luca Marini",ZAR:"Johann Zarco",BAS:"Enea Bastianini",MRA:"Diogo Moreira",QUA:"Fabio Quartararo",RIN:"Álex Rins",VIN:"Maverick Viñales",RAZ:"Toprak Razgatlıoğlu",MIL:"Jack Miller",PIR:"Michele Pirro",MIR:"Joan Mir",AMQ:"Álex Márquez",MMQ:"Marc Márquez",ALD:"Fermín Aldeguer",ESP:"Pol Espargaró",AFE:"Augusto Fernández",CRU:"Cal Crutchlow",LEC:"Iker Lecuona",SAV:"Lorenzo Savadori",FOL:"Jonas Folger",NAK:"Takaaki Nakagami",CHA:"Somkiat Chantra"};
const TEAM={"Michele Pirro":"Gresini","Cal Crutchlow":"LCR Honda","Lorenzo Savadori":"Aprilia Racing","Jonas Folger":"KTM Tech3","Somkiat Chantra":"Honda HRC"};DATA.drivers.forEach(d=>TEAM[d[0]]=d[1]);
/* Ordre d'arrivée : classés | abandons. null = pas encore renseigné (une entrée par Grand Prix, dans l'ordre) */
const RES=[
"BEZ ACO RFE MAR OGU DIG BIN MOR BAG MRN ZAR BAS MRA QUA RIN VIN RAZ MIL PIR | MIR AMQ MMQ",
"BEZ MAR DIG MMQ OGU AMQ ACO ALD ZAR RFE MRN MOR MRA RIN BAS QUA RAZ VIN | MIR BAG BIN MIL",
"BEZ MAR ACO DIG MMQ BAS AMQ RFE MRN BAG ALD BIN MRA MOR RAZ MIL QUA RIN | ZAR OGU MIR VIN",
"AMQ BEZ DIG MAR OGU RFE ZAR BAS ALD ACO BIN MOR MRN QUA MIR RIN MRA MIL RAZ AFE | BAG SAV MMQ",
"MAR BEZ OGU DIG ACO QUA BAS RFE ALD MRN ZAR RIN RAZ MOR MIL FOL | BIN MIR BAG MRA AMQ MMQ",
"DIG ALD BAG BEZ QUA MRN BIN OGU MRA MOR VIN AFE MIR RIN MIL RAZ RFE | MAR ACO BAS ZAR AMQ",
"BEZ MAR BAG OGU DIG ACO MMQ ALD RFE MRA BIN MIR MRN MOR MIL RAZ VIN QUA PIR | BAS RIN CRU",
"MMQ ACO BAG OGU MRN MRA LEC MIL BAS BIN RAZ DIG RIN MOR VIN | QUA MIR CRU MAR BEZ RFE ALD",
"MMQ OGU BAG DIG MIR ALD RFE MRN MAR BAS MRA BIN MOR RAZ VIN MIL CRU | ACO RIN QUA",
"OGU RFE MAR DIG AMQ BAS MMQ QUA RIN MRN BIN MIL VIN MRA AFE CRU | BAG RAZ ACO MOR BEZ MIR",
"MMQ OGU RFE ACO MAR BAG QUA MRN BAS BIN MRA MIL MOR RIN RAZ | VIN CRU AMQ MIR DIG",
"RFE MAR BEZ AMQ ACO DIG MMQ BIN MRN MRA MOR MIL ESP RAZ AFE QUA | OGU BAG CRU LEC BAS RIN MIR",
"MMQ ACO BEZ AMQ MAR ALD DIG BAS MRA BIN MIL MIR RIN MRN ZAR ESP SAV QUA | RAZ RFE BAG MOR",
"MMQ AMQ ACO ALD MAR RFE DIG BAS MRN QUA BIN RAZ MOR ESP | ZAR RIN BAG MIR MRA MIL BEZ",
"ACO MAR BEZ OGU MMQ BIN BAG ALD DIG ZAR BAS RFE NAK MRN MRA ESP QUA MOR RIN RAZ MIL | AMQ",
"MMQ MAR BEZ BAS RFE OGU ACO BAG ALD MRN BIN QUA CHA VIN MOR RIN RAZ DIG MIL ZAR | AMQ MRA"
];
const NOTE={7:"Seuls les 15 premiers sont confirmés ; l'ordre de Quartararo, Mir et Crutchlow (après la 15e place) n'a pas pu être vérifié. Martín, Bezzecchi, R. Fernández et Aldeguer ont chuté au premier virage.",8:"Bezzecchi était suspendu pour cette course ; Á. Márquez a déclaré forfait et Zarco était absent (blessés).",9:"Classement après pénalités (limites de piste, pression des pneus). Aldeguer et Zarco absents (blessés).",10:"Bezzecchi, Aldeguer et Zarco absents (blessés).",12:"Ogura (blessé) remplacé par Savadori ; Viñales (blessé) remplacé par Espargaró ; retour de Zarco et Aldeguer.",13:"Ogura toujours absent (blessé, sans remplaçant indiqué) ; Espargaró remplace Viñales.",14:"Mir absent, remplacé par Nakagami ; Espargaró remplace Viñales. Aldeguer rétrogradé en 8e position après pénalité.",15:"Mir absent ; Chantra remplace Nakagami (blessé) chez Honda. Á. Márquez et Zarco ont chuté après leur double long lap."};
function detail(i){
  const s=RES[i];
  if(!s)return '<div class="nodet">Classement complet bientôt disponible.</div>';
  const p=s.split("|").map(x=>x.trim().split(" ").filter(Boolean));
  const row=(c,k)=>{const n=N[c],t=TEAM[n]||"",col=COL[t]||"#888";return `<div class="rr"><span class="rp">${k}</span><span class="dot" style="background:${col}"></span><span>${n}${tg(t)}</span><span class="rt">${t}</span></div>`};
  return p[0].map((c,k)=>row(c,k+1)).join("")+(p[1]||[]).map(c=>row(c,"—")).join("")+'<div class="note">— : abandon ou non classé</div>'+(NOTE[i]?'<div class="note">'+NOTE[i]+'</div>':"");
}
document.getElementById("races").innerHTML=RACES.map((r,i)=>{const c=COL[r[3]]||"#888";
return `<div class="race" data-i="${i}"><div class="rd">${i+1}</div><div><div class="gp">GP ${r[0]}<span class="chev">▼</span></div><div class="dt">${r[1]} 2026</div></div><div class="win"><span class="dot" style="background:${c};display:inline-block;margin-right:5px"></span>${r[2]}<small>${r[3]}</small></div><div class="det">${detail(i)}</div></div>`}).reverse().join("");
document.getElementById("races").addEventListener("click",e=>{const r=e.target.closest(".race");if(r)r.classList.toggle("open")});
const T={};DATA.drivers.forEach(d=>T[d[1]]=(T[d[1]]||0)+d[2]);
const TL=Object.entries(T).sort((a,b)=>b[1]-a[1]);
document.getElementById("cons").innerHTML=TL.map((t,i)=>{const c=COL[t[0]]||"#888",gap=i?"−"+(TL[0][1]-t[1])+" pts":"Leader";
return `<div class="row drv tm${OPEN.has("T:"+t[0])?" open":""}" data-t="${t[0]}"><div class="pos">${i+1}</div><div><div class="name"><span class="dot" style="background:${c}"></span>${t[0]}<span class="chev">▼</span></div><div class="bar"><i style="width:${t[1]/TL[0][1]*100}%;background:${c}"></i></div></div><div class="pts">${t[1]}<span class="gap">${gap}</span></div><div class="dh">${OPEN.has("T:"+t[0])?thist(t[0]):""}</div></div>`}).join("");
const UP=[["Indonésie (Mandalika)","11 oct."],["Australie (Phillip Island)","25 oct."],["Malaisie (Sepang)","1 nov."],["Qatar","8 nov."],["Portugal","22 nov."],["Valence","29 nov."]];
document.getElementById("cal").innerHTML=RACES.map((r,i)=>`<div class="crow done"><span class="rp">${i+1}</span><div><b>GP ${r[0]}</b><small>Vainqueur : ${r[2]}</small></div><span class="d">${r[1]}</span></div>`).join("")+UP.map((u,i)=>`<div class="crow${i?"":" nx"}"><span class="rp">${RACES.length+i+1}</span><div><b>GP ${u[0]}</b><small>${i?"À venir":"Prochain Grand Prix"}</small></div><span class="d">${u[1]}</span></div>`).join("");
document.getElementById("nextbox").onclick=function(){const c=document.getElementById("cal");c.hidden=!c.hidden;this.classList.toggle("open",!c.hidden)};
function tab(n){["1","2","3"].forEach(k=>{document.getElementById("v"+k).hidden=k!=n;document.getElementById("t"+k).classList.toggle("on",k==n)})}
["1","2","3"].forEach(k=>document.getElementById("t"+k).onclick=()=>tab(k));

/* ===== Fiche pilote : historique + photo ===== */
const PH={};
const WT={"Kimi Antonelli":"Andrea Kimi Antonelli","George Russell":"George Russell (racing driver)","Carlos Sainz":"Carlos Sainz Jr.","Alex Albon":"Alexander Albon","Raúl Fernández":"Raúl Fernández (motorcyclist)","Jack Miller":"Jack Miller (motorcyclist)"};
const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function avHTML(n,col){return PH[n]?`<img alt="" referrerpolicy="no-referrer" src="${PH[n]}">`:ini(n)}
function hist(name){
  const code=Object.keys(N).find(k=>N[k]===name),team=TEAM[name]||"",col=COL[team]||"#888";
  const di=DATA.drivers.findIndex(d=>d[0]===name),pts=di>=0?DATA.drivers[di][2]:0;
  let w=0,pod=0,t5=0,fin=0,dnf=0,ent=0,sum=0,best=0;const chips=[];
  RES.forEach((s,i)=>{
    const g=(RACES[i]&&RACES[i][0])||"";let k=-1,x=false;
    if(s){const p=s.split("|").map(z=>z.trim().split(" ").filter(Boolean));k=p[0].indexOf(code);x=(p[1]||[]).includes(code)}
    let cls="",v="–";
    if(k>=0){const r=k+1;ent++;fin++;sum+=r;if(!best||r<best)best=r;if(r===1)w++;if(r<=3)pod++;if(r<=5)t5++;v=r;cls=r===1?"w":r<=3?"p":""}
    else if(x){ent++;dnf++;v="✕";cls="x"}
    else cls="n";
    chips.push(`<span class="ch ${cls}" title="GP ${g}"><i>${g.slice(0,3).toUpperCase()}</i>${v}</span>`)});
  const st=[[di+1+"e","Classement"],[pts,"Points"],[w,"Victoires"],[pod,"Podiums"],[t5,"Top 5"],[dnf,"Abandons / NC"],[ent,"Courses"],[best?best+"e":"–","Meilleur résultat"],[fin?(sum/fin).toFixed(1):"–","Position moy."]];
  return `<div class="pn" style="--tc:${col}">${wm(name,team)}<div class="dhead"><div class="av" data-n="${name}" style="background:${col}">${avHTML(name)}</div><div><div class="dn">${name}${tg(team)}</div><div class="ds">${team}${carOf(name,team)?" · "+carOf(name,team):""} · Saison 2026</div></div></div>${stHTML(st,[2,3,1])}<div class="chs">${chips.join("")}</div><div class="lg">Résultat de chaque Grand Prix (ordre de la saison). Or : victoire · gris : podium · ✕ : abandon ou non classé · – : absent.</div><div class="lg">Photo : Wikipédia (si disponible).</div></div>`;
}
async function photo(name){
  if(name in PH)return;PH[name]=null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent((WT[name]||name).replace(/ /g,"_")));
    if(!r.ok)return;const j=await r.json();
    if(j.type!=="standard"||!j.thumbnail||!/racing|driver|rider|motorcycl|motorsport|formula/i.test((j.description||"")+" "+(j.extract||"").slice(0,250)))return;
    PH[name]=j.thumbnail.source;
    document.querySelectorAll(".av").forEach(a=>{if(a.dataset.n===name)a.innerHTML=avHTML(name)});
  }catch(e){}
}
document.getElementById("list").addEventListener("click",e=>{
  const r=e.target.closest(".drv");if(!r||e.target.closest(".dh"))return;
  const n=r.dataset.n;
  if(OPEN.has(n)){OPEN.delete(n);r.classList.remove("open");return}
  OPEN.add(n);r.querySelector(".dh").innerHTML=hist(n);r.classList.add("open");photo(n);
});

/* ===== Fiche équipe : historique ===== */
function thist(team){
  const col=COL[team]||"#888",codes=Object.keys(N).filter(k=>TEAM[N[k]]===team);
  const T={};DATA.drivers.forEach(d=>T[d[1]]=(T[d[1]]||0)+d[2]);
  const TL=Object.entries(T).sort((a,b)=>b[1]-a[1]),rk=TL.findIndex(x=>x[0]===team)+1,pts=T[team]||0;
  let w=0,pod=0,t5=0,dnf=0,ent=0,best=0;const chips=[],per={};
  codes.forEach(c=>per[c]={w:0,pod:0,dnf:0,ent:0});
  RES.forEach((s,i)=>{
    const g=(RACES[i]&&RACES[i][0])||"";let b=0,any=false;
    if(s){const p=s.split("|").map(z=>z.trim().split(" ").filter(Boolean));
      codes.forEach(c=>{const k=p[0].indexOf(c);
        if(k>=0){const r=k+1;any=true;ent++;per[c].ent++;if(!b||r<b)b=r;if(r<=3){pod++;per[c].pod++}if(r<=5)t5++;if(r===1)per[c].w++}
        else if((p[1]||[]).includes(c)){any=true;ent++;dnf++;per[c].ent++;per[c].dnf++}})}
    let cls="n",v="–";
    if(b){v=b;cls=b===1?"w":b<=3?"p":"";if(b===1)w++;if(!best||b<best)best=b}
    else if(any){v="✕";cls="x"}
    chips.push(`<span class="ch ${cls}" title="GP ${g}"><i>${g.slice(0,3).toUpperCase()}</i>${v}</span>`)});
  const st=[[rk+"e","Classement"],[pts,"Points"],[w,"Victoires"],[pod,"Podiums (pilotes)"],[t5,"Top 5 (pilotes)"],[dnf,"Abandons / NC"],[ent,"Départs (pilotes)"],[best?best+"e":"–","Meilleur résultat"],[DATA.drivers.filter(d=>d[1]===team).length,"Pilotes"]];
  const dr=DATA.drivers.filter(d=>d[1]===team).map(d=>{const c=Object.keys(N).find(k=>N[k]===d[0]),q=per[c]||{w:0,pod:0,dnf:0,ent:0};
    return `<div class="rr" style="grid-template-columns:1fr auto"><span>${d[0]}</span><span class="rt">${d[2]} pts · ${q.w} vict. · ${q.pod} pod. · ${q.dnf} aband./NC</span></div>`}).join("");
  return `<div class="pn" style="--tc:${col}">${wm("",team)}<div class="dhead"><div class="av" style="background:${col}">${ini(team)}</div><div><div class="dn">${team}</div><div class="ds">${carOf("",team)?carOf("",team)+" · ":""}Saison 2026</div></div></div>${stHTML(st,[2,3,1])}<div class="ds" style="margin-bottom:6px">Détail par pilote</div>${dr}<div class="ds" style="margin:10px 0 6px">Meilleur résultat de l'équipe à chaque Grand Prix</div><div class="chs">${chips.join("")}</div><div class="lg">Or : victoire · gris : podium · ✕ : abandon ou non classé · – : absent. Les pilotes sont rattachés à leur équipe actuelle ; « Victoires » compte les courses gagnées par l'équipe.</div></div>`;
}
document.getElementById("cons").addEventListener("click",e=>{
  const r=e.target.closest(".tm");if(!r||e.target.closest(".dh"))return;
  const k="T:"+r.dataset.t;
  if(OPEN.has(k)){OPEN.delete(k);r.classList.remove("open");return}
  OPEN.add(k);r.querySelector(".dh").innerHTML=thist(r.dataset.t);r.classList.add("open");
});
</script>
</body>
</html>
